name: Work-native plugin

on:
  push:
    branches: [main, '1015-mojulo-3.1-plugin-update']
  pull_request:
  workflow_dispatch:

jobs:
  runner-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Test runner without needing a published Mojulo release
        run: node --test tests/runner.test.mjs

  npm-3-1-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Check the official Mojulo 3.1.0 npm release
        id: npm
        run: |
          if [ "$(npm view mojulo@3.1.0 version 2>/dev/null)" = "3.1.0" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Registry release verified"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Mojulo 3.1.0 is not published to npm yet. Runtime smoke is deferred, NOT passed. Rerun this workflow after npm publication."
          fi
      - name: End-to-end smoke against the published 3.1.0 package
        if: steps.npm.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          R="$GITHUB_WORKSPACE/work-plugin/skills/mojulo/scripts/runner.mjs"
          A="$RUNNER_TEMP/mojulo-3-1-a"
          B="$RUNNER_TEMP/mojulo-3-1-b"
          mkdir -p "$A" "$B"
          node "$R" install --workspace "$A" > "$RUNNER_TEMP/install-a.json"
          node "$R" install --workspace "$A" > "$RUNNER_TEMP/reuse.json"
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1]));if(!x.reused||x.installed?.version!=="3.1.0")process.exit(1)' "$RUNNER_TEMP/reuse.json"
          node "$R" exec --workspace "$A" -- orient > "$RUNNER_TEMP/orient.txt"
          node "$R" exec --workspace "$A" -- call version > "$RUNNER_TEMP/version.json"
          node "$R" exec --workspace "$A" -- call compose_world --json '{"base":"city","seed":91,"ref":"sk_work_ci","title":"Work-native 3.1 CI","overrides":{"context":{"depth":2},"region":{"x":0,"y":0,"w":16,"d":16}}}' > "$RUNNER_TEMP/mint.json"
          node "$R" exec --workspace "$A" -- call export_model --json '{"ref":"sk_work_ci","format":"glb"}' > "$RUNNER_TEMP/before.json"
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1]));if(!x.path||!fs.existsSync(x.path))process.exit(1);fs.copyFileSync(x.path,process.argv[2])' "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/before.glb"
          node "$R" exec --workspace "$A" -- call update_sketch --json '{"ref":"sk_work_ci","patch":[{"op":"set","path":"/seed","value":92}]}' > "$RUNNER_TEMP/edit.json"
          node "$R" exec --workspace "$A" -- call export_model --json '{"ref":"sk_work_ci","format":"glb"}' > "$RUNNER_TEMP/after.json"
          node -e 'const fs=require("fs"),crypto=require("crypto");const x=JSON.parse(fs.readFileSync(process.argv[1]));if(!x.path||!fs.existsSync(x.path))process.exit(1);const sha=p=>crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex");if(sha(x.path)===sha(process.argv[2]))process.exit(2)' "$RUNNER_TEMP/after.json" "$RUNNER_TEMP/before.glb"
          node "$R" exec --workspace "$A" -- call export_model --json '{"ref":"sk_work_ci","format":"bundle"}' > "$RUNNER_TEMP/bundle-a.json"
          DIR_A="$(node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync(process.argv[1]));if(!x.dir)process.exit(1);process.stdout.write(x.dir)' "$RUNNER_TEMP/bundle-a.json")"
          for file in recipe.json model.glb world.html; do test -s "$DIR_A/$file"; done
          node "$R" checkpoint --workspace "$A" --recipe "$DIR_A/recipe.json" --ref sk_work_ci --title "Work-native 3.1 CI" --out "$RUNNER_TEMP/restore-capsule.json"
          node "$R" install --workspace "$B" > "$RUNNER_TEMP/install-b.json"
          node "$R" restore --workspace "$B" --capsule "$RUNNER_TEMP/restore-capsule.json" > "$RUNNER_TEMP/restore.out"
          node "$R" exec --workspace "$B" -- call export_model --json '{"ref":"sk_work_ci","format":"bundle"}' > "$RUNNER_TEMP/bundle-b.json"
          DIR_B="$(node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync(process.argv[1]));if(!x.dir)process.exit(1);process.stdout.write(x.dir)' "$RUNNER_TEMP/bundle-b.json")"
          node -e 'const fs=require("fs"),crypto=require("crypto"),path=require("path");const [a,b]=process.argv.slice(1);const h=p=>crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex");for(const f of ["recipe.json","model.glb","world.html"]){if(h(path.join(a,f))!==h(path.join(b,f))){console.error("Mismatch:",f);process.exit(1)}}' "$DIR_A" "$DIR_B"
          if node "$R" restore --workspace "$B" --capsule "$RUNNER_TEMP/restore-capsule.json" > "$RUNNER_TEMP/duplicate.out" 2>&1; then
            echo "::error::Duplicate restore unexpectedly succeeded"
            exit 1
          fi
          grep -Eqi 'exists|REF_EXISTS' "$RUNNER_TEMP/duplicate.out"
          test -d "$A/.mojulo-chatgpt/home"
          test -d "$B/.mojulo-chatgpt/home"
          echo "Mojulo 3.1.0 npm install, reuse, mint, edit, export, recover and duplicate protection passed."
